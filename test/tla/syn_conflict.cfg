\* Issue #96: the connection between nodes 1 and 2 drops twice while both stay connected to node 3,
\* and the resolver keeps the process started first.

INIT Init
NEXT Next

CONSTANTS
    NONE = NONE
    Nodes = {1, 2, 3}
    Names = {a}
    Times = {1}
    Resolver = "oldest"
    MonotonicClocks = FALSE
    RegisterNodes = {1, 2}
    CutPairs = {{1, 2}}
    RestartNodes = {}
    MaxRegister = 2
    MaxRemoteCall = 0
    MaxUpdate = 0
    MaxUnregister = 0
    MaxExit = 0
    MaxDisconnect = 2
    MaxRestart = 0
    HideAfterConflict = FALSE
    RefreshWinner = FALSE
    WithdrawBeforeResult = FALSE
    NoRediscover = FALSE
    NoAskOnAdopt = FALSE
    ResolveByRole = FALSE

INVARIANTS
    DeliveredInChannel
    Membership
    Agreement
    OneOwner
    ResolutionBounded
    Survivor
