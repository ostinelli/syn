\* Message traffic always stops: two nodes, a scope process restart and a dropped connection.

SPECIFICATION Spec

CONSTANTS
    NONE = NONE
    Nodes = {1, 2}
    Names = {a}
    Times = {1}
    Resolver = "newest"
    MonotonicClocks = FALSE
    RegisterNodes = {1, 2}
    CutPairs = {{1, 2}}
    RestartNodes = {2}
    MaxRegister = 1
    MaxRemoteCall = 0
    MaxUpdate = 0
    MaxUnregister = 0
    MaxExit = 0
    MaxDisconnect = 1
    MaxRestart = 1
    HideAfterConflict = FALSE
    RefreshWinner = FALSE
    WithdrawBeforeResult = FALSE
    NoRediscover = FALSE
    NoAskOnAdopt = FALSE
    ResolveByRole = FALSE

INVARIANTS
    Membership
    Agreement
    OneOwner
    ResolutionBounded
    Survivor

PROPERTIES
    Termination
