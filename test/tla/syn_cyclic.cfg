\* Three nodes register the same name, with a resolver where no process beats both others: every
\* node must still agree, even if all three drop it.

INIT Init
NEXT Next

CONSTANTS
    NONE = NONE
    Nodes = {1, 2, 3}
    Names = {a}
    Times = {1}
    Resolver = "cyclic"
    MonotonicClocks = FALSE
    RegisterNodes = {1, 2, 3}
    CutPairs = {{1, 2}, {1, 3}, {2, 3}}
    RestartNodes = {}
    MaxRegister = 3
    MaxRemoteCall = 0
    MaxUpdate = 0
    MaxUnregister = 0
    MaxExit = 0
    MaxDisconnect = 1
    MaxRestart = 0
    HideAfterConflict = FALSE
    RefreshWinner = FALSE
    WithdrawBeforeResult = FALSE
    NoRediscover = FALSE
    NoAskOnAdopt = FALSE
    ResolveByRole = FALSE

INVARIANTS
    DeliveredInChannel
    Membership
    Agreement
    OneOwner
    ResolutionBounded
    Survivor
