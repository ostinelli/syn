\* Message traffic always stops: three nodes register the same name and the resolver keeps
\* none of them.

SPECIFICATION Spec

CONSTANTS
    NONE = NONE
    Nodes = {1, 2, 3}
    Names = {a}
    Times = {1}
    Resolver = "neither"
    MonotonicClocks = FALSE
    RegisterNodes = {1, 2, 3}
    CutPairs = {{1, 2}, {1, 3}, {2, 3}}
    RestartNodes = {}
    MaxRegister = 3
    MaxRemoteCall = 0
    MaxUpdate = 0
    MaxUnregister = 0
    MaxExit = 0
    MaxDisconnect = 0
    MaxRestart = 0
    HideAfterConflict = FALSE
    RefreshWinner = FALSE
    WithdrawBeforeResult = FALSE
    NoRediscover = FALSE
    NoAskOnAdopt = FALSE
    ResolveByRole = FALSE

INVARIANTS
    Membership
    Agreement
    OneOwner
    ResolutionBounded

PROPERTIES
    Termination
