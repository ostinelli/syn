\* Message traffic always stops: two nodes, an unregistration and a process exiting.

SPECIFICATION Spec

CONSTANTS
    NONE = NONE
    Nodes = {1, 2}
    Names = {a}
    Times = {1}
    Resolver = "newest"
    MonotonicClocks = FALSE
    RegisterNodes = {1, 2}
    CutPairs = {}
    RestartNodes = {}
    MaxRegister = 2
    MaxRemoteCall = 0
    MaxUpdate = 0
    MaxUnregister = 1
    MaxExit = 1
    MaxDisconnect = 0
    MaxRestart = 0
    HideAfterConflict = FALSE
    RefreshWinner = FALSE
    WithdrawBeforeResult = FALSE
    NoRediscover = FALSE
    NoAskOnAdopt = FALSE

INVARIANTS
    Membership
    Agreement
    OneOwner
    ResolutionBounded
    Survivor

PROPERTIES
    Termination
