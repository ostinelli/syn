\* Clocks that disagree with Syn's default resolver, and an update during the conflict: the name must
\* still end up with a winner.

INIT Init
NEXT Next

CONSTANTS
    NONE = NONE
    Nodes = {1, 2, 3}
    Names = {a}
    Times = {1, 2}
    Resolver = "newest"
    MonotonicClocks = TRUE
    RegisterNodes = {1, 2}
    CutPairs = {{1, 2}}
    RestartNodes = {}
    MaxRegister = 2
    MaxRemoteCall = 0
    MaxUpdate = 1
    MaxUnregister = 0
    MaxExit = 0
    MaxDisconnect = 1
    MaxRestart = 0
    HideAfterConflict = FALSE
    RefreshWinner = FALSE
    WithdrawBeforeResult = FALSE
    NoRediscover = FALSE
    NoAskOnAdopt = FALSE
    ResolveByRole = FALSE

INVARIANTS
    DeliveredInChannel
    Membership
    Agreement
    OneOwner
    ResolutionBounded
    Survivor
