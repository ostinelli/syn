\* Must fail: a node that learns of a new scope process through a call doesn't ask for its data.

INIT Init
NEXT Next

CONSTANTS
    NONE = NONE
    Nodes = {1, 2}
    Names = {a}
    Times = {1}
    Resolver = "newest"
    MonotonicClocks = FALSE
    RegisterNodes = {1, 2}
    CutPairs = {{1, 2}}
    RestartNodes = {2}
    MaxRegister = 1
    MaxRemoteCall = 1
    MaxUpdate = 0
    MaxUnregister = 0
    MaxExit = 0
    MaxDisconnect = 1
    MaxRestart = 1
    HideAfterConflict = FALSE
    RefreshWinner = FALSE
    WithdrawBeforeResult = FALSE
    NoRediscover = FALSE
    NoAskOnAdopt = TRUE

INVARIANTS
    DeliveredInChannel
    Membership
    Agreement
    OneOwner
    ResolutionBounded
    Survivor
