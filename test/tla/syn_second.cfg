\* Two nodes register the same name with the same time while their connection is down, and the resolver keeps
\* the claim passed second on a tie: both nodes pass the claims in node order, so they keep the same process.

INIT Init
NEXT Next

CONSTANTS
    NONE = NONE
    Nodes = {1, 2, 3}
    Names = {a}
    Times = {1}
    Resolver = "second"
    MonotonicClocks = FALSE
    RegisterNodes = {1, 2}
    CutPairs = {{1, 2}}
    RestartNodes = {}
    MaxRegister = 2
    MaxRemoteCall = 0
    MaxUpdate = 0
    MaxUnregister = 0
    MaxExit = 0
    MaxDisconnect = 1
    MaxRestart = 0
    HideAfterConflict = FALSE
    RefreshWinner = FALSE
    WithdrawBeforeResult = FALSE
    NoRediscover = FALSE
    NoAskOnAdopt = FALSE
    ResolveByRole = FALSE

INVARIANTS
    DeliveredInChannel
    Membership
    Agreement
    OneOwner
    ResolutionBounded
    Survivor
