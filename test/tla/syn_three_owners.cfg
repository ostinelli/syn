\* Issue #96 on a larger cluster: three nodes register the same name and the resolver keeps the older process.
\* Node 3 can lose its own conflict to node 1, then show node 2's registration, which loses on node 2 to node 3's
\* process; the connection between nodes 2 and 3 can drop before or after node 2 drops its process.

INIT Init
NEXT Next

CONSTANTS
    NONE = NONE
    Nodes = {1, 2, 3}
    Names = {a}
    Times = {1}
    Resolver = "oldest"
    MonotonicClocks = FALSE
    RegisterNodes = {1, 2, 3}
    CutPairs = {{2, 3}}
    RestartNodes = {}
    MaxRegister = 3
    MaxRemoteCall = 0
    MaxUpdate = 0
    MaxUnregister = 0
    MaxExit = 0
    MaxDisconnect = 1
    MaxRestart = 0
    HideAfterConflict = FALSE
    RefreshWinner = FALSE
    WithdrawBeforeResult = FALSE
    NoRediscover = FALSE
    NoAskOnAdopt = FALSE
    ResolveByRole = FALSE

INVARIANTS
    DeliveredInChannel
    Membership
    Agreement
    OneOwner
    ResolutionBounded
    Survivor
